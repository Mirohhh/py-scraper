<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Scraper</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="topnav">
    <a href="/" class="active">Scraper</a>
    <a href="/docs">Docs</a>
  </nav>
  <div class="container">
    <h1>Web Scraper</h1>

    <div class="url-section">
      <label for="url-input">Target URLs <span class="label-hint">(one per line)</span></label>
      <textarea
        id="url-input"
        rows="4"
        placeholder="https://example.com&#10;https://inside.fifa.com/fifa-world-ranking/men&#10;https://another-site.com"
        spellcheck="false"
      ></textarea>
    </div>

    <div class="builder">
      <div class="palette">
        <h3>Commands</h3>
        <div class="palette-buttons">
          <button data-cmd="scroll" title="Scroll to bottom">
            <span class="cmd-icon">&#8595;</span> Scroll
          </button>
          <button data-cmd="click" title="Click element by text or selector">
            <span class="cmd-icon">&#9758;</span> Click
          </button>
          <button data-cmd="extract" title="Extract data with CSS selector">
            <span class="cmd-icon">&#9632;</span> Extract
          </button>
          <button data-cmd="wait_selector" title="Wait for element">
            <span class="cmd-icon">&#9201;</span> Wait for Selector
          </button>
          <button data-cmd="wait_timeout" title="Wait for duration">
            <span class="cmd-icon">&#9203;</span> Wait (ms)
          </button>
        </div>

        <h3 class="palette-sub">Pipeline</h3>
        <div class="palette-buttons">
          <button id="export-pipeline-btn" title="Save pipeline to file">
            <span class="cmd-icon">&#8593;</span> Export
          </button>
          <button id="import-pipeline-btn" title="Load pipeline from file">
            <span class="cmd-icon">&#8595;</span> Import
          </button>
          <input type="file" id="import-file-input" accept=".json" style="display:none">
        </div>
      </div>

      <div class="pipeline">
        <h3>Pipeline</h3>
        <div id="pipeline-list" class="pipeline-list">
          <div class="pipeline-empty">Click a command to add it here</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="run-btn" class="run-btn">Run Scraper</button>
      <span id="status" class="status"></span>
    </div>

    <div id="results" class="results hidden">
      <div class="results-header">
        <h3>Results</h3>
        <div class="results-actions">
          <button id="download-csv-btn" class="secondary-btn" style="display:none">Download CSV</button>
          <button id="download-zip-btn" class="secondary-btn">Download All (.zip)</button>
        </div>
      </div>
      <div id="results-list" class="results-list"></div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
